name: Verify Critical

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mailbox-ci-only
          POSTGRES_DB: softora_mailbox_lock_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d softora_mailbox_lock_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: 01 Agent guardrails
        run: npm run check:guardrails
      - name: 02 Repo hygiene
        run: npm run check:repo-hygiene
      - name: 03 Public data
        run: npm run check:public-data
      - name: 04 Dependency audit
        run: npm run check:deps
      - name: 05 Quality lock
        run: npm run check:quality-lock
      - name: 06 Contract tests
        run: npm run test:contracts
        env:
          MAILBOX_POSTGRES_TEST_URL: postgresql://postgres:mailbox-ci-only@127.0.0.1:5432/softora_mailbox_lock_test_ci
          MAILBOX_POSTGRES_TEST_ALLOW_DESTRUCTIVE: '1'
          MAILBOX_POSTGRES_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: 07 Smoke tests
        run: npm run test:smoke
      - name: 08 Postgres mailbox locks
        run: npm run test:postgres:mailbox-locks
        env:
          MAILBOX_POSTGRES_TEST_URL: postgresql://postgres:mailbox-ci-only@127.0.0.1:5432/softora_mailbox_lock_test_ci
          MAILBOX_POSTGRES_TEST_ALLOW_DESTRUCTIVE: '1'
          MAILBOX_POSTGRES_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: 09 Secret scan
        run: npm run check:secrets
