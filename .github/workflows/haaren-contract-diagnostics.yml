name: Haaren contract diagnostics
on:
  push:
    branches: [codex/haaren-distance-order-20260915]
    paths: [.github/workflows/haaren-contract-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print only failing contracts from the existing verification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          url = 'https://api.github.com/repos/Serve63/softora.nl/actions/jobs/104587188608/logs'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              text = response.read().decode('utf-8-sig')
          lines = [re.sub(r'^\S+Z ', '', line) for line in text.splitlines()]
          matches = [i for i, line in enumerate(lines) if re.match(r'not ok \d+ - ', line)]
          print('FAILED CONTRACTS:', len(matches))
          for i in matches:
              block = []
              for line in lines[i:i+100]:
                  if block and line.startswith('# Subtest:'):
                      break
                  block.append(line)
              print('\n' + '\n'.join(block)[:12000])
          PY
