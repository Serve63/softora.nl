name: Haaren recipient order contracts
on:
  push:
    branches: [codex/haaren-distance-order-20260915]
    paths: [.github/workflows/haaren-contract-diagnostics.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/haaren-distance-order-20260915
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Keep existing safety assertions while updating ordered fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/contracts/coldmail-campaign.test.js')
          original = p.read_text()
          s = original
          def edit(title, replacements):
              global s
              start = s.index("test('" + title + "',")
              end = s.find("\ntest(", start + 1)
              if end < 0: end = len(s)
              block = s[start:end]
              for old, new in replacements:
                  assert block.count(old) == 1, (title, old, block.count(old))
                  block = block.replace(old, new)
              s = s[:start] + block + s[end:]
          edit('coldmail campaign keeps the standard subject and body when variants are provided', [
              ("    'Nieuw webdesign gemaakt voor Lunchroom Maan',\n    'Nieuw webdesign gemaakt voor Café Nova',", "    'Nieuw webdesign gemaakt voor Café Nova',\n    'Nieuw webdesign gemaakt voor Lunchroom Maan',"),
              (r'assert.match(stripEmailWordJoiners(sentMessages[1].text), /lunchroommaan\.nl/);', r'assert.match(stripEmailWordJoiners(sentMessages[2].text), /lunchroommaan\.nl/);'),
              (r'assert.match(stripEmailWordJoiners(sentMessages[2].text), /cafenova\.nl/);', r'assert.match(stripEmailWordJoiners(sentMessages[1].text), /cafenova\.nl/);'),
          ])
          edit('coldmail autopilot stores a compact failure reason summary after a partial candidate scan', [
              ("id: 'missing-photo',", "id: 'missing-photo', lat: 51.6027, lng: 5.2222,"),
          ])
          edit('coldmail campaign vult de preview aan wanneer een eerdere kandidaat afvalt', [
              ("id: 'bad-domain',", "id: 'bad-domain', stad: 'Haaren',"),
          ])
          edit('coldmail campaign recipient preview respects Oisterwijk radius', [
              ("assert.equal(result.recipients[0].distanceKm, 0);", "assert.equal(result.recipients[0].distanceKm, 3.5); // Preview distance is now measured from Haaren."),
          ])
          edit('coldmail campaign radius includes real customer database places near Oisterwijk', [
              ("['Chaam Winkel', 'Alphen Studio', 'Helvoirt Studio']", "['Helvoirt Studio', 'Alphen Studio', 'Chaam Winkel']"),
          ])
          edit('coldmail preview matches stored webdesigns with normalized company identities', [
              ("['fresh-jaghthuijs-id', 'fresh-zon-id']", "['fresh-zon-id', 'fresh-jaghthuijs-id']"),
          ])
          for title in ['coldmail campaign sends personal mailbox domains by default', 'coldmail campaign caps personal mailbox domains separately from business domains']:
              edit(title, [("['ruben@gmail.com', 'ruben@example.test']", "['ruben@example.test', 'ruben@gmail.com']")])
          assert len(original.splitlines()) == len(s.splitlines())
          p.write_text(s)
          p = Path('test/contracts/customers-page-bootstrap.test.js')
          s = p.read_text()
          old = "assert.deepEqual(payload.customers.map((customer) => customer.id), ['mail-ready-1', 'magnivita', 'bliv']);"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "assert.deepEqual(payload.customers.map((customer) => customer.id), ['mail-ready-1', 'bliv', 'magnivita']);"))
          PY
          git diff --check
      - run: npm ci
      - name: Exercise all affected contracts without production mail
        run: |
          node --test --test-name-pattern='standard subject and body|compact failure reason summary|eerdere kandidaat afvalt|preview respects Oisterwijk|radius includes real|normalized company identities|personal mailbox domains|category-incomplete compact' test/contracts/coldmail-campaign.test.js test/contracts/customers-page-bootstrap.test.js
          node --test test/contracts/premium-database-location-boot.test.js test/contracts/premium-database-haaren-order.test.js test/contracts/premium-database-distance-preview.test.js
      - name: Save only the validated fixture adjustments
        run: |
          test "$(git branch --show-current)" = 'codex/haaren-distance-order-20260915'
          git add test/contracts/coldmail-campaign.test.js test/contracts/customers-page-bootstrap.test.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: keep guard and fallback coverage under Haaren recipient priority'
          git push origin HEAD:refs/heads/codex/haaren-distance-order-20260915
