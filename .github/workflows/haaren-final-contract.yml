name: Haaren final sorter contract
on:
  push:
    branches: [codex/haaren-distance-order-20260915]
    paths: [.github/workflows/haaren-final-contract.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/haaren-distance-order-20260915
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check the same index-preserving map through its extracted helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/contracts/premium-database-ui.test.js')
          s = p.read_text()
          old = r'  assert.match(sorterSource, /\.map\(function \(customer, index\) \{/);'
          new = r'  assert.match(sorterSource, /\.map\(buildCustomerSortEntry\)/);'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          node --test --test-name-pattern='premium database sorteert bedrijven standaard' test/contracts/premium-database-ui.test.js
          node --test test/contracts/premium-database-location-boot.test.js test/contracts/premium-database-haaren-order.test.js test/contracts/premium-database-distance-preview.test.js
          git diff --check
          test "$(git branch --show-current)" = 'codex/haaren-distance-order-20260915'
          git add test/contracts/premium-database-ui.test.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: assert extracted index-preserving distance map helper'
          git push origin HEAD:refs/heads/codex/haaren-distance-order-20260915
