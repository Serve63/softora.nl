name: Haaren distance repair workspace
on:
  push:
    branches: [codex/haaren-distance-order-20260915]
    paths: [.github/workflows/haaren-distance-maintenance.yml, scripts/haaren-distance-maintenance.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Inspect ordering paths without sending mail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = ['server/services/coldmail-campaign.js', 'server/services/instantly-outreach.js', 'premium-database.html', 'assets/premium-database-mail-ready-snapshot.js', 'server/services/premium-database-mail-ready-snapshot.js', 'assets/premium-database-target-coords.js']
          for name in paths:
              p = Path(name)
              if not p.exists():
                  print('MISSING', name)
                  continue
              lines = p.read_text().splitlines()
              print('\nFILE', name, 'LINES', len(lines))
              indexes = set()
              for i, line in enumerate(lines):
                  if re.search(r'\.sort\(|function .*([Ss]elect|[Cc]andidate|[Ee]ligible|[Ll]oadRows|[Ff]iltered)|sortCustomers\(|getDistanceKm|Object\.freeze|module\.exports', line):
                      for j in range(max(0, i-3), min(len(lines), i+9)):
                          indexes.add(j)
              for i in sorted(indexes):
                  print(f'{i+1}: {lines[i]}')
          PY
