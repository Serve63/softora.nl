name: Haaren distance repair workspace
on:
  push:
    branches: [codex/haaren-distance-order-20260915]
    paths: [.github/workflows/haaren-distance-maintenance.yml, scripts/haaren-distance-maintenance.py]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/haaren-distance-order-20260915
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded source changes without production data
        run: |
          python3 scripts/haaren-distance-maintenance.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('premium-database.html')
          text, count = re.subn(r'(assets/premium-database-sent-register\.js)(?:\?[^"\s]*)?', r'\1?v=20260915-haaren-order-1', path.read_text())
          assert count == 1
          path.write_text(text)
          PY
          node --check assets/premium-database-distance.js
          node --check assets/premium-database-sent-register.js
          node --check server/services/coldmail-campaign.js
          node --check server/services/instantly-outreach.js
          node --check server/services/premium-database-mail-ready-snapshot.js
          node --check server/services/premium-database-snapshot-cache.js
          git diff --check
          git diff --stat
      - name: Save source changes only to isolated repair branch
        run: |
          test "$(git branch --show-current)" = 'codex/haaren-distance-order-20260915'
          git add assets/premium-database-distance.js premium-database.html server/services/coldmail-campaign.js server/services/instantly-outreach.js server/services/premium-database-mail-ready-snapshot.js server/services/premium-database-snapshot-cache.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: unify database and outbound ordering by distance from Haaren'
          git push origin HEAD:refs/heads/codex/haaren-distance-order-20260915
      - run: npm ci
      - name: Test Haaren ordering with fake recipients and no external sends
        run: node --test test/contracts/premium-database-haaren-order.test.js
