name: Haaren distance repair workspace
on:
  push:
    branches: [codex/haaren-distance-order-20260915]
    paths: [.github/workflows/haaren-distance-maintenance.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/haaren-distance-order-20260915
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Complete browser fixture and remove temporary tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/contracts/premium-database-haaren-order.test.js')
          s = p.read_text()
          assert s.count('const browser = {};') == 1
          p.write_text(s.replace('const browser = {};', 'const browser = { atob };'))
          Path('scripts/haaren-distance-maintenance.py').unlink()
          Path('.github/workflows/haaren-distance-maintenance.yml').unlink()
          PY
          test "$(git branch --show-current)" = 'codex/haaren-distance-order-20260915'
          git diff --check
          git add test/contracts/premium-database-haaren-order.test.js scripts/haaren-distance-maintenance.py .github/workflows/haaren-distance-maintenance.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: supply browser base64 API and remove temporary repair workspace'
          git push origin HEAD:refs/heads/codex/haaren-distance-order-20260915
      - run: npm ci
      - name: Run database contract regression tests without sending email
        run: |
          status=0
          node --test --test-reporter=junit test/contracts/*premium-database*.test.js > /tmp/haaren-contracts.xml || status=$?
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('/tmp/haaren-contracts.xml')
          cases = tree.findall('.//testcase')
          failures = [(case, failure) for case in cases for failure in case.findall('failure')]
          print('DATABASE CONTRACTS:', len(cases), 'tests;', len(failures), 'failures')
          for case, failure in failures:
              print('\nFAILED:', case.get('name'))
              print((failure.text or '')[:7000])
          PY
          exit "$status"
