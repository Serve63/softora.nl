name: Haaren preview compatibility repair
on:
  push:
    branches: [codex/haaren-distance-order-20260915]
    paths: [.github/workflows/haaren-boot-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/haaren-distance-order-20260915
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Preserve the existing call distance contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/services/coldmail-campaign.js')
          s = p.read_text()
          start = s.index('  async function getColdmailCampaignRecipients(input = {}) {')
          end = s.index('  function getColdmailReplyHistoryEntry(row)', start)
          block = s[start:end]
          old = 'const website = getRowDomain(item.row);'
          new = "const website = getRowDomain(item.row), distanceKm = resolved.mode === 'call' ? getRowDistanceKm(item.row) : getHaarenDistanceKm(item.row);"
          assert block.count(old) == 1
          block = block.replace(old, new)
          old = 'distanceKm: Number.isFinite(getHaarenDistanceKm(item.row)) ? Math.round(getHaarenDistanceKm(item.row) * 10) / 10 : null,'
          assert block.count(old) == 1
          block = block.replace(old, 'distanceKm: Number.isFinite(distanceKm) ? Math.round(distanceKm * 10) / 10 : null,')
          p.write_text(s[:start] + block + s[end:])
          PY
          node --check server/services/coldmail-campaign.js
          node --test test/contracts/premium-database-location-boot.test.js test/contracts/premium-database-haaren-order.test.js test/contracts/premium-database-distance-preview.test.js
          git diff --check
          test "$(git branch --show-current)" = 'codex/haaren-distance-order-20260915'
          git add server/services/coldmail-campaign.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: report Haaren mail distances without changing coldcalling previews'
          git push origin HEAD:refs/heads/codex/haaren-distance-order-20260915
