name: Diagnose WHOOP Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAILBOX_POSTGRES_TEST_URL: postgresql://postgres:mailbox-ci-only@127.0.0.1:5432/softora_mailbox_lock_test_ci
      MAILBOX_POSTGRES_TEST_ALLOW_DESTRUCTIVE: '1'
      MAILBOX_POSTGRES_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mailbox-ci-only
          POSTGRES_DB: softora_mailbox_lock_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d softora_mailbox_lock_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: 01 Quality lock
        run: node scripts/check-quality-lock.js
      - name: 02 Canonical frontend
        run: node scripts/check-canonical-frontend.js
      - name: 03 JS syntax
        run: node scripts/check-js-syntax.js
      - name: 04 Guaranteed test scope
        run: node scripts/check-guaranteed-test-scope.js
      - name: 05 Guardrails
        run: node scripts/verify-guardrails.js
      - name: 06 Static serving contract
        run: node scripts/check-static-serving-contract.js
      - name: 07 Critical tests
        run: npm run test:critical
      - name: 08 Runtime contracts
        run: node scripts/check-runtime-contracts.js
      - name: 09 Active orders contract
        run: node scripts/check-active-orders-contract.js
      - name: 10 Brain
        run: node scripts/check-brain.js
      - name: 11 Brain quality
        run: node scripts/check-brain-quality.js
      - name: 12 No localization
        run: node scripts/check-no-localization.js
      - name: 13 External domains
        run: node scripts/check-hardcoded-external-domains.js
      - name: 14 Commitments backlog
        run: node scripts/check-commitments-backlog.js
      - name: 15 SEO canonical
        run: node scripts/check-seo-canonical.js
      - name: 16 Dashboard header
        run: node scripts/check-dashboard-header-contract.js
      - name: 17 Critical user routes
        run: node scripts/check-critical-user-routes.js
      - name: 18 First sale flow
        run: node scripts/check-first-sale-flow.js
      - name: 19 First sale launch
        run: node scripts/check-first-sale-launch.js
      - name: 20 Audit pack
        run: node scripts/check-audit-pack.js
