    * { box-sizing: border-box; }

    .lead-radar-shell { display: flex; min-height: 100vh; }
    .lead-radar-shell__content {
      width: calc(100% - var(--premium-sidebar-width, 320px));

      margin-left: var(--premium-sidebar-width, 320px);
      overflow: hidden;
      background: #f4f1ed;

    .lead-radar-shell__frame {
      display: block;
      width: 100%;

      html, body { overflow: auto; }
      .lead-radar-shell { display: block; }
      .lead-radar-shell__content { width: 100%; margin-left: 0; min-height: 100dvh; }
