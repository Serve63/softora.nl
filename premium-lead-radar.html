<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Softora | Lead Radar</title>
  <link rel="icon" type="image/png" href="/assets/softora-search-favicon.png" sizes="512x512">
  <link rel="icon" type="image/png" href="/assets/softora-favicon-round.png?v=20260616a" sizes="any">
  <link rel="apple-touch-icon" href="/assets/softora-touch-icon.png?v=20260615a">
  <link rel="stylesheet" href="/assets/lead-radar.css?v=20260818d">
</head>
<body class="lead-radar-page">
  <main class="lead-radar-app">
    <header class="lead-radar-header">
      <div>
        <p class="lead-radar-eyebrow">SOFTORA ACQUISITIE</p>
        <h1>Lead Radar</h1>
        <p class="lead-radar-subtitle">Openbare websitevragen uit Facebook en LinkedIn, met bedrijfs- en websitecontrole.</p>
      </div>
    </header>

    <section class="status-banner" id="provider-banner" hidden></section>

    <section class="metric-grid" aria-label="Lead Radar tellingen">
      <article class="metric-card metric-card--primary"><span>Totale leads</span><strong id="metric-total">-</strong><small>opgeslagen in Lead Radar</small></article>
      <article class="metric-card"><span>Nieuwe leads</span><strong id="metric-new">-</strong><small>nog te beoordelen</small></article>
    </section>

    <section class="scan-panel" aria-label="Lead Radar scan">
      <div class="scan-panel__intro">
        <div>
            <p class="section-kicker">LANDDEKKING</p>
            <h2>Nieuwe leads zoeken</h2>
        </div>
        <div class="scan-panel__controls">
          <div class="scan-field">
            <span class="scan-field__label">Platforms</span>
            <div class="custom-select" id="scan-platforms" data-value="facebook,linkedin">
              <button class="custom-select__trigger" type="button" data-custom-select-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="scan-platforms-menu">
                <span class="custom-select__value">Facebook en LinkedIn</span>
              </button>
              <div class="custom-select__menu" id="scan-platforms-menu" role="listbox" tabindex="-1" hidden>
                <button class="custom-select__option" type="button" role="option" data-custom-select-option data-value="facebook,linkedin" aria-selected="true">Facebook en LinkedIn</button>
                <button class="custom-select__option" type="button" role="option" data-custom-select-option data-value="facebook" aria-selected="false">Facebook</button>
                <button class="custom-select__option" type="button" role="option" data-custom-select-option data-value="linkedin" aria-selected="false">LinkedIn</button>
              </div>
            </div>
          </div>
          <label>Regio
            <select id="scan-region-mode">
              <option value="nationwide" selected>Heel Nederland</option>
              <option value="regional">Nederland + provincies en steden</option>
            </select>
          </label>
          <label>Periode
            <select id="scan-max-age-days">
              <option value="30" selected>Laatste 30 dagen</option>
              <option value="7">Laatste 7 dagen</option>
              <option value="3">Laatste 3 dagen</option>
              <option value="1">Laatste 24 uur</option>
            </select>
          </label>
          <button class="button button-primary scan-button" id="scan-button" type="button">Scan starten</button>
        </div>
      </div>
      <div class="scan-progress" id="scan-progress" hidden role="status" aria-live="polite">
        <div class="scan-progress__bar"><span id="scan-progress-bar"></span></div>
        <span id="scan-progress-label">Scan wordt uitgevoerd...</span>
      </div>
    </section>

    <section class="inbox-section" aria-label="Lead Radar inbox">
      <div class="inbox-heading">
        <div><p class="section-kicker">INBOX</p><h2>Recente leads</h2></div>
        <span class="result-count" id="result-count">0 resultaten</span>
      </div>

      <div class="inbox-state" id="inbox-state" hidden></div>
      <div class="lead-list" id="lead-list"></div>
      <div class="pagination" id="pagination" hidden>
        <button class="button button-secondary" id="previous-page-button" type="button">Vorige</button>
        <span id="page-label">Pagina 1</span>
        <button class="button button-secondary" id="next-page-button" type="button">Volgende</button>
      </div>
    </section>

  </main>
  <script src="/assets/lead-radar.js?v=20260818d" defer></script>
</body>
</html>
