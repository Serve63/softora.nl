<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Softora | Lead Radar</title>
  <link rel="icon" type="image/png" href="/assets/softora-search-favicon.png" sizes="512x512">
  <link rel="icon" type="image/png" href="/assets/softora-favicon-round.png?v=20260616a" sizes="any">
  <link rel="apple-touch-icon" href="/assets/softora-touch-icon.png?v=20260615a">
  <link rel="stylesheet" href="/assets/lead-radar.css?v=20260906a">
</head>
<body class="lead-radar-page">
  <main class="lead-radar-app">
    <header class="lead-radar-header">
      <div>
        <p class="lead-radar-eyebrow">SOFTORA ACQUISITIE</p>
        <h1>Lead Radar</h1>
        <p class="lead-radar-subtitle">Eigen scanner voor openbare website-, software- en automatiseringsvragen.</p>
      </div>
    </header>

    <section class="status-banner" id="provider-banner" hidden></section>

    <section class="metric-grid" aria-label="Lead Radar tellingen">
      <article class="metric-card metric-card--primary"><span>Totale leads</span><strong id="metric-total">-</strong><small>recente, gecontroleerde aanvragen</small></article>
      <article class="metric-card metric-card--scan">
        <div class="metric-card__summary"><span>Nieuwe leads</span><strong id="metric-new">-</strong><small>nog te beoordelen</small></div>
        <button class="button button-primary scan-button" id="scan-button" type="button" disabled>Scan starten</button>
        <div class="scan-progress" id="scan-progress" hidden role="status" aria-live="polite">
          <div class="scan-progress__bar"><span id="scan-progress-bar"></span></div>
          <span id="scan-progress-label">Scan wordt uitgevoerd...</span>
        </div>
      </article>
    </section>

    <section class="scan-summary" id="scan-summary" aria-label="Resultaat laatste scan" aria-live="polite" hidden></section>

    <section class="inbox-section" aria-label="Lead Radar inbox">
      <div class="inbox-heading">
        <div><p class="section-kicker">INBOX</p><h2>Recente leads</h2></div>
        <span class="result-count" id="result-count">0 resultaten</span>
      </div>

      <div class="inbox-state" id="inbox-state" hidden></div>
      <div class="lead-list" id="lead-list"></div>
      <div class="pagination" id="pagination" hidden>
        <button class="button button-secondary" id="previous-page-button" type="button">Vorige</button>
        <span id="page-label">Pagina 1</span>
        <button class="button button-secondary" id="next-page-button" type="button">Volgende</button>
      </div>
    </section>

  </main>
  <script src="/assets/lead-radar.js?v=20260906a" defer></script>
</body>
</html>
